name: food11-litdata

volumes:
  food11:
  lit_out:

services:
  extract-data:
    image: python:3.11
    user: root
    volumes:
      - food11:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends curl unzip
        rm -rf /var/lib/apt/lists/*

        echo "Resetting dataset directory..."
        rm -rf Food-11

        echo "Downloading dataset zip..."
        curl -L https://nyu.box.com/shared/static/m5kvcl25hfpljul3elhu6xz8y2w61op4.zip \
          -o Food-11.zip

        echo "Unzipping dataset..."
        unzip -q Food-11.zip
        rm -f Food-11.zip

  transform-data:
    image: python:3.11
    volumes:
      - food11:/data
    working_dir: /data/Food-11
    command:
      - bash
      - -c
      - |
        set -e
        python3 -c '
        import os
        import shutil

        dataset_base_dir = "/data/Food-11"
        subdirs = ["training", "validation", "evaluation"]
        classes = [
            "Bread", "Dairy product", "Dessert", "Egg", "Fried food",
            "Meat", "Noodles/Pasta", "Rice", "Seafood", "Soup", "Vegetable/Fruit"
        ]

        for subdir in subdirs:
            dir_path = os.path.join(dataset_base_dir, subdir)
            if not os.path.exists(dir_path):
                continue

            for i, class_name in enumerate(classes):
                class_dir = os.path.join(dir_path, f"class_{i:02d}")
                os.makedirs(class_dir, exist_ok=True)
                for f in os.listdir(dir_path):
                    if f.startswith(f"{i}_"):
                        shutil.move(
                            os.path.join(dir_path, f),
                            os.path.join(class_dir, f)
                        )
        '

  optimize-litdata:
    build:
      context: .
      dockerfile: Dockerfile.litdata
    environment:
      - LITDATA_CHUNK_BYTES=64MB
      - LITDATA_NUM_WORKERS=4
    volumes:
      - food11:/data:ro
      - lit_out:/out
    command:
      - bash
      - -c
      - |
        set -e
        python - <<'PY'
        import os
        from pathlib import Path
        from PIL import Image
        from litdata import optimize

        data_root = Path("/data/Food-11")
        out_root = Path("/out")
        chunk_bytes = os.environ.get("LITDATA_CHUNK_BYTES", "64MB")
        num_workers = int(os.environ.get("LITDATA_NUM_WORKERS", "4"))

        def records_for_split(split_dir: Path):
            records = []
            for class_dir in sorted(split_dir.glob("class_*")):
                label = int(class_dir.name.split("_")[1])
                for img_path in sorted(class_dir.rglob("*")):
                    if img_path.suffix.lower() not in (".jpg", ".jpeg", ".png"):
                        continue
                    records.append({"image_path": str(img_path), "label": label})
            return records

        def encode_sample(sample):
            return {
                "image": Image.open(sample["image_path"]).convert("RGB"),
                "label": int(sample["label"]),
            }

        for split in ["training", "validation", "evaluation"]:
            split_dir = data_root / split
            if not split_dir.exists():
                continue
            out_dir = out_root / split
            out_dir.mkdir(parents=True, exist_ok=True)
            inputs = records_for_split(split_dir)
            optimize(
                fn=encode_sample,
                inputs=inputs,
                output_dir=str(out_dir),
                chunk_bytes=chunk_bytes,
                num_workers=num_workers,
            )

        print("Wrote LitData chunks under /out")
        PY

  upload-litdata:
    image: rclone/rclone:latest
    depends_on:
      - optimize-litdata
    volumes:
      - lit_out:/out:ro
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi

        echo "Cleaning up existing destination prefix..."
        rclone delete rclone_s3:$RCLONE_CONTAINER/Food-11-litdata --rmdirs || true

        echo "Uploading LitData chunks..."
        rclone copy /out rclone_s3:$RCLONE_CONTAINER/Food-11-litdata \
          --progress \
          --transfers=8 \
          --checkers=4 \
          --retries=5 \
          --retries-sleep=10s \
          --low-level-retries=10 \
          --timeout=120s \
          --contimeout=60s

        echo "Listing directories after upload:"
        rclone lsd rclone_s3:$RCLONE_CONTAINER/Food-11-litdata
