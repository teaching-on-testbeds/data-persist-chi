name: food11-object-load

volumes:
  food11:

services:
  extract-data:
    image: python:3.11
    user: root
    volumes:
      - food11:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends curl unzip
        rm -rf /var/lib/apt/lists/*

        echo "Resetting dataset directory..."
        rm -rf Food-11

        echo "Downloading dataset zip..."
        curl -L https://nyu.box.com/shared/static/m5kvcl25hfpljul3elhu6xz8y2w61op4.zip \
          -o Food-11.zip

        echo "Unzipping dataset..."
        unzip -q Food-11.zip
        rm -f Food-11.zip

        echo "Listing contents of /data after extract stage:"
        ls -l /data

  transform-data:
    image: python:3.11
    volumes:
      - food11:/data
    working_dir: /data/Food-11
    command:
      - bash
      - -c
      - |
        set -e
        python3 -c '
        import os
        import shutil

        dataset_base_dir = "/data/Food-11"
        subdirs = ["training", "validation", "evaluation"]
        classes = [
            "Bread", "Dairy product", "Dessert", "Egg", "Fried food",
            "Meat", "Noodles/Pasta", "Rice", "Seafood", "Soup", "Vegetable/Fruit"
        ]

        for subdir in subdirs:
            dir_path = os.path.join(dataset_base_dir, subdir)
            if not os.path.exists(dir_path):
                continue

            for i, class_name in enumerate(classes):
                class_dir = os.path.join(dir_path, f"class_{i:02d}")
                os.makedirs(class_dir, exist_ok=True)
                for f in os.listdir(dir_path):
                    if f.startswith(f"{i}_"):
                        shutil.move(
                            os.path.join(dir_path, f),
                            os.path.join(class_dir, f)
                        )
        '

        echo "Listing contents of /data/Food-11 after transform stage:"
        ls -l /data/Food-11

  load-data:
    image: rclone/rclone:latest
    volumes:
      - food11:/data
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi

        echo "Using S3 API to upload data..."
        echo "Cleaning up existing contents of destination prefix..."
        rclone delete rclone_s3:$RCLONE_CONTAINER/Food-11 --rmdirs || true

        echo "Uploading Food-11 directory tree..."
        rclone copy /data/Food-11 rclone_s3:$RCLONE_CONTAINER/Food-11 \
          --progress \
          --transfers=8 \
          --checkers=4 \
          --retries=5 \
          --retries-sleep=10s \
          --low-level-retries=10 \
          --timeout=120s \
          --contimeout=60s

        echo "Listing directories after upload:"
        rclone lsd rclone_s3:$RCLONE_CONTAINER/Food-11
